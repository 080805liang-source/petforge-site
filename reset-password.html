<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#edf6f2">
  <title>PET FORGE | 重置密码</title>
  <link rel="stylesheet" href="styles/main.css?v=stable-20260906">
  <link rel="stylesheet" href="styles/recovery.css?v=shortcut-20261109-r1">
  <script src="scripts/supabase-config.js?v=security-20261108-r2"></script>
  <script src="scripts/session.js?v=shortcut-20261109-r1"></script>
  <script src="scripts/i18n.js?v=shortcut-20261109-r1" defer></script>
  <script src="scripts/recovery.js?v=shortcut-20261109-r1" defer></script>
</head>
<body class="recovery-body">
  <header class="recovery-header"><a class="brand" href="./"><img class="brand-cat-mark" src="assets/brand-cat-20261027.png" width="34" height="34" alt=""><b>PET FORGE</b></a><a href="./">返回首页</a></header>
  <main class="recovery-main">
    <aside class="recovery-art" aria-hidden="true"><img src="assets/workshop-pixel-room.svg" width="640" height="420" alt=""><p>小伙伴还在等你回家。</p></aside>
    <section class="recovery-card" aria-labelledby="recovery-title">
      <a id="recovery-back" class="recovery-back" href="./?login=1">← 返回登录</a>
      <div class="recovery-lock" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
      <h1 id="recovery-title">忘记密码了？</h1>
      <p id="recovery-intro">通过注册邮箱验证身份，重新设置密码。</p>
      <ol class="recovery-steps" aria-label="重置密码进度"><li aria-current="step"><span>1</span>验证邮箱</li><li><span>2</span>设置密码</li><li><span>3</span>完成</li></ol>
      <form id="recovery-form">
        <label for="recovery-email">注册邮箱</label>
        <div class="recovery-email-row"><input id="recovery-email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="100" required><button id="recovery-edit" type="button" hidden>更换邮箱</button></div>
        <div id="recovery-details" hidden>
          <label for="recovery-code">邮箱验证码</label>
          <div class="recovery-code-row"><input id="recovery-code" type="text" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码"><button id="recovery-resend" type="button">重新发送</button></div>
          <p class="recovery-hint">验证码 10 分钟内有效，请使用最新一封邮件；也请检查垃圾邮件。</p>
          <label for="recovery-password">新密码</label>
          <div class="recovery-password-row"><input id="recovery-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" placeholder="至少 8 位，建议组合字母和数字"><button id="recovery-reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
          <label for="recovery-confirm">确认新密码</label><input id="recovery-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256" placeholder="请再次输入新密码">
        </div>
        <p id="recovery-note" role="status" aria-live="polite"></p>
        <button id="recovery-submit" type="submit">发送邮箱验证码</button>
      </form>
      <section id="recovery-success" hidden><p>密码已更新，旧的登录状态已失效。</p><a class="recovery-login" href="./?login=1">使用新密码登录</a></section>
      <p class="recovery-safe">只有能接收注册邮箱验证码的人，才能重置密码。</p>
      <a class="recovery-help" href="support.html">无法收到邮件？查看帮助</a>
    </section>
  </main>
</body>
</html>
